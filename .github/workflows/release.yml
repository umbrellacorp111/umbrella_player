name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r SOVAKOD/requirements.txt pyinstaller
      - name: Validate sources
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath "SOVAKOD" -Filter "*.py" -File
          if (-not $files) { throw "No Python source files found" }
          foreach ($file in $files) {
            python -m py_compile $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller "Umbrella Player.spec" --noconfirm --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/Umbrella Player.exe")) { throw "PyInstaller output is missing" }
      - name: Build updater
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --noconsole --name "Umbrella Player Updater" SOVAKOD/updater_main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/Umbrella Player Updater.exe")) { throw "Updater output is missing" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/payload" | Out-Null
          Copy-Item "dist/Umbrella Player.exe" "dist/payload/"
          Copy-Item "dist/Umbrella Player Updater.exe" "dist/payload/"
      - name: Build installer
        shell: pwsh
        run: iscc installer/UmbrellaPlayer.iss
      - name: Create portable archive and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/payload/*" -DestinationPath "release/UmbrellaPlayer-${{ github.ref_name }}-win64.zip"
          $hash = (Get-FileHash "release/UmbrellaPlayer-${{ github.ref_name }}-win64.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content "release/UmbrellaPlayer-${{ github.ref_name }}-win64.sha256" $hash
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/*.sha256
